[package]
name = "orq-pc"
version = "0.2.0"
edition = "2021"
description = "CLI nativa ultraleve em Rust para controle local do Orquestra no PC (Kamus Edition)"

[[bin]]
name = "orq-pc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
